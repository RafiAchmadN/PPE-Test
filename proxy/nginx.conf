# Reverse proxy TLS-terminating untuk MAPPER (lihat docs/SAAS_READINESS_AUDIT.md §2/§4).
#
# Backend & frontend TIDAK lagi publish port langsung ke host — satu-satunya
# jalan masuk dari luar container adalah lewat proxy ini (port 8443 & 5443).
#
# Sertifikat di sini bawaannya SELF-SIGNED (lihat scripts/generate-self-signed-cert.sh)
# — cukup untuk testing/LAN, browser akan menampilkan peringatan "Not Secure"
# sampai diterima manual atau di-import ke trust store. Untuk produksi/demo
# publik, ganti proxy/certs/cert.pem + key.pem dengan sertifikat asli
# (Let's Encrypt atau CA internal perusahaan) — tidak perlu ubah apa pun di
# file ini, cukup timpa file sertifikatnya.

# Frontend (React SPA)
server {
    listen 8443 ssl;
    server_name _;

    # Resolver Docker embedded DNS (127.0.0.11) + proxy_pass lewat variabel:
    # supaya nginx me-resolve ulang nama service tiap kali (bukan cache IP
    # selamanya) — kalau container ppe-frontend di-restart dan dapat IP baru,
    # proxy tetap jalan tanpa perlu restart nginx juga.
    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $upstream_frontend http://ppe-frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Backend (Flask JSON API + MJPEG stream)
server {
    listen 5443 ssl;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 500m;  # ikuti MAX_UPLOAD_MB di backend (default 500MB)

    location / {
        set $upstream_backend http://ppe-backend:5000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MJPEG adalah stream jangka panjang — matikan buffering supaya frame
        # diteruskan langsung, dan naikkan timeout supaya koneksi tidak
        # diputus proxy saat browser menonton lama.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
