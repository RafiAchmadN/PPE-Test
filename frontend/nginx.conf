server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bundle JS/CSS Vite tidak pernah dikompresi sebelumnya -> dikirim mentah
    # ke browser tiap load. gzip di sini murni transport, tidak mengubah
    # konten yang dilayani.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript text/xml application/xml image/svg+xml font/ttf
        font/otf application/wasm;

    # SPA: semua route non-file jatuh ke index.html, React Router yang menangani.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
