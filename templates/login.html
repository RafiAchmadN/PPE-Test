<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPE Monitor — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0e14;--bg-card:#13151e;--bg-card2:#191c28;
  --border:#1e2233;--border-light:#2a2e42;
  --text:#e1e4ed;--text-dim:#6b7194;--text-muted:#454b6b;
  --accent:#6366f1;--accent-glow:#818cf833;
  --red:#ef4444;--green:#22c55e;
  --radius:12px;--radius-sm:8px;
  --font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;width:380px;max-width:90vw;padding:40px;box-shadow:0 32px 80px #00000060}
.logo{width:56px;height:56px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;margin:0 auto 24px;letter-spacing:-1px}
h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:32px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.form-group input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--font);transition:border .15s;outline:none}
.form-group input:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;font-family:var(--font);transition:all .15s;margin-top:8px}
.btn:hover{background:#4f46e5;box-shadow:0 0 24px var(--accent-glow)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.footer{margin-top:32px;text-align:center;font-size:11px;color:var(--text-muted);font-family:var(--mono)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PPE</div>
  <h1>PPE Monitoring System</h1>
  <p class="sub">Masuk untuk mengakses dashboard</p>

  <form onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" id="loginBtn">Masuk</button>
    <div class="err" id="errMsg"></div>
  </form>

  <div class="footer">ITS Surabaya &nbsp;·&nbsp; PPE Detection v1.0</div>
</div>

<script>
async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('errMsg');
  btn.disabled=true;btn.textContent='Memuat...';err.textContent='';
  try{
    const r=await fetch('/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value,
        password:document.getElementById('password').value
      })
    });
    const d=await r.json();
    if(r.ok){window.location.href='/';}
    else{err.textContent=d.error||'Login gagal';}
  }catch(ex){err.textContent='Tidak dapat terhubung ke server.';}
  finally{btn.disabled=false;btn.textContent='Masuk';}
}
</script>
</body>
</html>
