services:
  ppe-backend:
    build:
      context: .
      dockerfile: PPE-Dockerfile
    container_name: ppe-backend
    restart: unless-stopped
    volumes:
      - ./logging.db:/app/logging.db
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_ORIGIN=http://localhost:8080
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - web

  ppe-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: ppe-frontend
    restart: unless-stopped
    depends_on:
      - ppe-backend
    ports:
      - "8080:80"
    networks:
      - web

networks:
  web:
    external: true
