services:
  ppe-dashboard:
    build: .
    container_name: ppe-dashboard
    restart: unless-stopped
    volumes:
      # Persist database dan foto hasil capture
      - ./logging.db:/app/logging.db
      - ./foto:/app/foto
    environment:
      - PYTHONUNBUFFERED=1
      - APP_BASE_URL=/ppe
    networks:
      - web

networks:
  web:
    external: true
