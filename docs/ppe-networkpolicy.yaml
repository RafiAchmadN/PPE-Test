# Default-deny semua ingress traffic ke namespace ppe, lalu allow eksplisit
# HANYA dari pod Traefik (kube-system) ke masing-masing Service PPE. Tanpa
# ini, pod mana pun di cluster (termasuk yang nanti ditambah untuk proyek
# lain) bisa langsung bicara ke ppe-backend-svc tanpa lewat Ingress sama
# sekali — NetworkPolicy inilah yang memaksa satu-satunya jalan masuk lewat
# Traefik. Egress tidak dibatasi (DNS/internet tetap jalan seperti biasa) —
# scope-nya cuma "siapa boleh masuk", sesuai kebutuhan, bukan isolasi total.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-backend
spec:
  podSelector:
    matchLabels:
      app: ppe-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-frontend
spec:
  podSelector:
    matchLabels:
      app: ppe-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
