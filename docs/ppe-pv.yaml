# PersistentVolumeClaim untuk data runtime PPE (logging.db, data/violations,
# data/videos, backups/) — BUKAN untuk model .pt (model sudah ikut ter-bake ke
# image Docker lewat "COPY . ." di Dockerfile, tidak perlu volume terpisah).
#
# Konsep: PVC = "permintaan" storage ("saya butuh 5Gi yang bertahan walau pod
# restart/dijadwalkan ulang"). StorageClass "local-path" (sudah default di
# cluster k3d-mu, lihat docs/README.md) yang MENYEDIAKAN permintaan itu secara
# otomatis di balik layar — beda dengan manifest lama yang bikin PersistentVolume
# manual + hostPath hardcoded (rawan salah path, tidak portable).
#
# accessMode ReadWriteOnce karena local-path itu storage lokal per-node
# (cocok untuk homelab 1 node aktif), bukan storage terdistribusi seperti NFS/
# Longhorn yang mendukung ReadWriteMany.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ppe-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
