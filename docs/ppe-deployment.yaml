# Deployment + Service untuk backend (Flask API + inferensi) dan frontend
# (React SPA di-serve nginx) — dua service terpisah, sinkron dengan arsitektur
# 3-container di PPE-docker-compose.yml (ppe-backend + ppe-frontend + ppe-proxy;
# proxy TLS diganti fungsinya oleh Ingress Traefik bawaan k3d, lihat ppe-ingress.yaml).
#
# CPU-only (sengaja, bukan belum sempat) — sudah dicoba GPU passthrough sampai ke
# NVIDIA GPU Operator (NFD, ClusterPolicy) dan mentok di ketidakcocokan OS dasar
# image node k3d/rancher-k3s (bukan distro Linux standar; tidak terbaca NFD, biner
# glibc NVIDIA tidak jalan di sana). Root cause di luar kendali manifest ini — lihat
# riwayat troubleshooting di percakapan. GPU tetap dipakai penuh lewat Docker Compose
# (PPE-docker-compose.yml), yang tidak kena masalah ini karena tidak ada lapisan
# node Kubernetes/NFD di antaranya.

# ─── RBAC ─────────────────────────────────────────────────────────────────
# ServiceAccount khusus per-workload, TANPA Role/RoleBinding sama sekali, dan
# automountServiceAccountToken dimatikan — backend/frontend tidak pernah
# memanggil K8s API, jadi least-privilege yang benar bukan "kasih izin
# terbatas", tapi cabut total token-nya. Kalau nanti butuh akses API,
# baru tambah Role scoped di sini.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ppe-backend-sa
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ppe-frontend-sa
automountServiceAccountToken: false

# ─── BACKEND ──────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppe-backend
spec:
  replicas: 1   # 1 saja: model YOLO + kamera stateful di memori, belum didesain multi-replica
  selector:
    matchLabels:
      app: ppe-backend
  template:
    metadata:
      labels:
        app: ppe-backend
    spec:
      serviceAccountName: ppe-backend-sa
      automountServiceAccountToken: false
      initContainers:
        # PVC baru selalu kosong. Container ini menyiapkan logging.db (file kosong,
        # nanti diisi skema oleh init_db() saat Flask start) + folder data/backups
        # SEBELUM container utama jalan — supaya container utama tidak crash mencoba
        # buka file yang belum ada.
        - name: seed-storage
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /storage/data/violations /storage/data/videos /storage/backups
              touch /storage/logging.db
          volumeMounts:
            - name: ppe-data
              mountPath: /storage
      containers:
        - name: ppe-backend
          image: ppe-backend:latest
          imagePullPolicy: Never   # image lokal hasil "k3d image import", bukan dari registry
          ports:
            - containerPort: 5000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FRONTEND_ORIGIN
              value: "http://ppe.127.0.0.1.nip.io:8080"
            - name: SESSION_COOKIE_SECURE
              value: "0"   # Ingress demo ini HTTP saja (lihat ppe-ingress.yaml) — beda
                           # dengan instance pelanggan (Docker Compose) yang sudah TLS
            # - name: DEMO_MODE
            #   value: "1"   # aktifkan HANYA untuk demo publik terbatas, lihat docs/SAAS_READINESS_AUDIT.md §8
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ppe-secrets   # dibuat manual lewat kubectl, TIDAK di-commit — lihat docs/README.md
                  key: SECRET_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
            # nvidia.com/gpu: 1 sengaja TIDAK diminta di sini — lihat catatan CPU-only
            # di komentar atas file ini. load_model() di app_web.py otomatis fallback
            # ke CPU kalau CUDA tidak terdeteksi (tidak perlu ubah kode/env apapun).
          volumeMounts:
            # subPath: mount SATU PVC yang sama ke 3 lokasi berbeda di dalam container,
            # supaya /app/best.pt & source code (dari image) tidak ikut tertimpa PVC kosong.
            - name: ppe-data
              mountPath: /app/logging.db
              subPath: logging.db
            - name: ppe-data
              mountPath: /app/data
              subPath: data
            - name: ppe-data
              mountPath: /app/backups
              subPath: backups
          readinessProbe:   # kapan pod boleh mulai menerima traffic dari Service
            httpGet:
              path: /api/auth/status   # endpoint publik, tidak perlu login, respons cepat
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:    # kapan Kubernetes harus restart pod karena macet
            httpGet:
              path: /api/auth/status
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: ppe-data
          persistentVolumeClaim:
            claimName: ppe-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ppe-backend-svc
spec:
  selector:
    app: ppe-backend
  ports:
    - port: 5000
      targetPort: 5000

# ─── FRONTEND ─────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppe-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ppe-frontend
  template:
    metadata:
      labels:
        app: ppe-frontend
    spec:
      serviceAccountName: ppe-frontend-sa
      automountServiceAccountToken: false
      containers:
        - name: ppe-frontend
          image: ppe-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      # Tidak ada volume — frontend murni static file hasil build, stateless.
---
apiVersion: v1
kind: Service
metadata:
  name: ppe-frontend-svc
spec:
  selector:
    app: ppe-frontend
  ports:
    - port: 80
      targetPort: 80
