# kube-prometheus-stack values sized for a small CPU-only 2-node k3d homelab
# (shared host: ~12 CPU / ~7.7Gi RAM total, PPE app already using ~1-3Gi).
# See docs/README.md for the cluster's CPU-only / homelab-not-production context.

# k3s runs scheduler/controller-manager/proxy/etcd inside the single
# `k3s server` process, not as separately-scrapeable Services the chart
# expects — leaving these on just produces permanently-failing targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: { storage: 4Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: { storage: 1Gi }

grafana:
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.127.0.0.1.nip.io
    path: /

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
